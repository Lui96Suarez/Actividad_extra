<div class="auth-container">
    <h2>Módulo de Acceso</h2>
    <form id="auth-form">
        <div class="form-group">
            <input type="email" id="email" placeholder="Correo Electrónico" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Contraseña" required>
        </div>
        <div class="auth-actions">
            <button type="submit" id="btn-login">Iniciar Sesión</button>
            <button type="button" id="btn-register">Registrarse</button>
        </div>
        <hr>
        <button type="button" id="btn-recover" class="link-btn">¿Olvidaste tu contraseña? Restablécela aquí</button>
    </form>
    <p id="auth-messages"></p>
</div>
